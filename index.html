<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 가족 가계부</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font-family:system-ui,sans-serif}main{max-width:760px;margin:24px auto;padding:0 16px}h1{font-size:26px}h2{font-size:20px}section,.entry{border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}label{display:block;margin:10px 0}input,select,button{font:inherit;font-size:16px;max-width:100%;border:1px solid #bbb;border-radius:7px;padding:11px}input,select{width:100%;margin-top:5px;min-width:0}button{cursor:pointer;background:#f5f5f5;margin:4px 4px 4px 0}button.primary{background:#245c49;color:white;border-color:#245c49}button:disabled{opacity:.55;cursor:wait}.row{display:flex;gap:12px;flex-wrap:wrap}.row>label{flex:1 1 140px}.summary{display:flex;gap:12px;flex-wrap:wrap}.summary>div{flex:1 1 150px;padding:12px;background:#f7f7f7;border-radius:8px}.summary strong{display:block;margin-top:5px;overflow-wrap:anywhere}small,.muted{color:#666}.entry p{white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0}#msg{white-space:pre-wrap;color:#8b3025;min-height:24px;overflow-wrap:anywhere}#inviteText{overflow-wrap:anywhere;user-select:all} [hidden]{display:none!important}
</style><main><h1>우리 가족 가계부</h1><p class="muted">함께 기록하는 수입과 지출</p><p id="msg" role="status" aria-live="polite"></p>
<section id="auth"><h2>로그인 · 회원가입</h2><form id="authForm"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><label>표시 이름 (회원가입 시 필수)<input id="displayName" maxlength="40" autocomplete="nickname"></label><button class="primary" type="submit">로그인</button><button id="signup" type="button">회원가입</button></form></section>
<div id="signed" hidden><p><span id="who"></span> <button id="logout">로그아웃</button></p>
<section id="setup" hidden><h2>가족 가계부 시작하기</h2><button id="create" class="primary">새 가족 가계부 만들기</button><label>초대 코드<input id="joinCode" autocomplete="off"></label><button id="join">초대 코드로 참여하기</button></section>
<div id="ledger" hidden><section id="invite" hidden><h2>가족 초대</h2><p id="inviteText"></p><small id="expiry"></small><p><button id="copy">코드 복사</button><button id="renew">초대 코드 재발급</button></p><small>가족에게만 전달하세요. 7일 뒤 만료되며 재발급 시 기존 코드는 무효화됩니다.</small></section>
<section><h2 id="editorTitle">내역 입력</h2><form id="entryForm"><div class="row"><label>거래일<input id="date" type="date" required></label><label>구분<select id="type"><option value="expense">지출</option><option value="income">수입</option></select></label></div><div class="row"><label>금액 (원)<input id="amount" type="number" inputmode="numeric" min="1" max="999999999999" step="1" required></label><label>분류<select id="category"></select></label></div><label>내용 (선택)<input id="description" maxlength="500"></label><button id="save" class="primary" type="submit">저장</button><button id="cancel" type="button" hidden>수정 취소</button></form></section>
<section><h2>월별 내역</h2><label>조회 월<input id="month" type="month" required></label><div class="summary"><div>수입<strong id="income">0원</strong></div><div>지출<strong id="expense">0원</strong></div><div>수입−지출<strong id="balance">0원</strong></div></div><p><small>선택한 월의 차액이며 실제 통장 잔액이 아닙니다.</small></p><small id="connection">연결 중…</small><div id="entries"></div></section></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),db=supabase.createClient('https://stcgyjgtzlxdinbsrxxr.supabase.co','sb_publishable_3__GGiMv4eUZ9Ss4M-Ja7Q_08PSKkt1',{auth:{storageKey:'family-ledger-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let user=null,family=null,channel=null,editing=null,inviteCode='',generation=0,loadNumber=0,busy=false;
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const money=n=>BigInt(n).toLocaleString('ko-KR')+'원';
const categories={income:['급여','기타수입'],expense:['식비','생활용품','교통','주거·공과금','교육','의료','기타지출']};
function say(s){$('msg').textContent=s}
function result(r){if(r.error)throw r.error;return r.data}
async function act(fn){if(busy)return;busy=true;const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);say('처리 중…');try{await fn();if($('msg').textContent==='처리 중…')say('')}catch(e){say('처리하지 못했습니다: '+e.message)}finally{busy=false;buttons.forEach(b=>b.disabled=false)}}
function options(){ $('category').replaceChildren(...categories[$('type').value].map(x=>new Option(x,x))) }
function reset(){editing=null;$('editorTitle').textContent='내역 입력';$('save').textContent='저장';$('cancel').hidden=true;$('entryForm').reset();$('date').value=today();options()}
function clear(){generation++;loadNumber++;family=null;inviteCode='';editing=null;if(channel){db.removeChannel(channel);channel=null}$('entries').replaceChildren();$('inviteText').textContent='';$('expiry').textContent='';$('who').textContent='';['income','expense','balance'].forEach(id=>$(id).textContent='0원');$('ledger').hidden=true;$('setup').hidden=true;$('signed').hidden=true;$('invite').hidden=true;reset()}
async function readInvite(){if(!family)return;const data=result(await db.from('ledger_invites').select('code,expires_at').eq('family_id',family).maybeSingle());$('invite').hidden=!data;if(data){inviteCode=data.code;$('inviteText').textContent=data.code;$('expiry').textContent='만료: '+new Date(data.expires_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' (한국 시간)'}}
async function load(){
 if(!family)return; const f=family,g=generation,seq=++loadNumber,m=$('month').value;if(!/^\d{4}-\d{2}$/.test(m))return;
 const [y,mo]=m.split('-').map(Number),next=mo===12?(y+1)+'-01-01':y+'-'+String(mo+1).padStart(2,'0')+'-01';
 const members=result(await db.from('ledger_members').select('user_id,display_name').eq('family_id',f));let rows=[],offset=0;
 for(;;){const part=result(await db.from('ledger_entries').select('*').eq('family_id',f).gte('transaction_date',m+'-01').lt('transaction_date',next).order('transaction_date',{ascending:false}).order('id').range(offset,offset+499));rows.push(...part);if(part.length<500)break;offset+=500}
 if(g!==generation||f!==family||seq!==loadNumber)return;
 const names=Object.fromEntries(members.map(x=>[x.user_id,x.display_name]));let inc=0n,out=0n;const fragment=document.createDocumentFragment();
 rows.forEach(r=>{if(r.type==='income')inc+=BigInt(r.amount);else out+=BigInt(r.amount);const card=document.createElement('div');card.className='entry';const title=document.createElement('strong');title.textContent=r.transaction_date+' · '+(r.type==='income'?'수입':'지출')+' '+money(r.amount);const info=document.createElement('p');info.textContent=r.category+' · '+(names[r.user_id]||'가족');const desc=document.createElement('p');desc.textContent=r.description;card.append(title,info,desc);
 if(r.user_id===user.id){const edit=document.createElement('button');edit.textContent='수정';edit.onclick=()=>{editing=r.id;$('editorTitle').textContent='내역 수정';$('date').value=r.transaction_date;$('type').value=r.type;options();$('category').value=r.category;$('amount').value=r.amount;$('description').value=r.description;$('save').textContent='수정 저장';$('cancel').hidden=false;$('editorTitle').scrollIntoView({behavior:'smooth'})};
 const del=document.createElement('button');del.textContent='삭제';del.onclick=()=>{if(confirm(r.transaction_date+' '+money(r.amount)+' 내역을 삭제할까요?'))act(async()=>{const deleted=result(await db.from('ledger_entries').delete().eq('id',r.id).select('id'));if(!deleted.length)throw Error('내역이 없거나 삭제 권한이 없습니다');if(editing===r.id)reset();await load()})};card.append(edit,del)}fragment.append(card)});
 $('entries').replaceChildren(fragment);if(!rows.length)$('entries').textContent='이 달에 기록한 내역이 없습니다.';$('income').textContent=money(inc);$('expense').textContent=money(out);$('balance').textContent=money(inc-out);
}
async function setupFamily(){const member=result(await db.from('ledger_members').select('family_id,display_name').eq('user_id',user.id).maybeSingle());$('who').textContent=member?.display_name||user.user_metadata?.display_name||'가족';$('setup').hidden=!!member;if(!member)return;family=member.family_id;$('ledger').hidden=false;await readInvite();await load();if(channel)await db.removeChannel(channel);await db.realtime.setAuth((await db.auth.getSession()).data.session?.access_token);const f=family;channel=db.channel('ledger-'+f).on('postgres_changes',{event:'UPDATE',schema:'public',table:'ledger_families',filter:'id=eq.'+f},()=>load().catch(e=>say(e.message))).subscribe(status=>{if(f!==family)return;$('connection').textContent=status==='SUBSCRIBED'?'실시간 연결됨':'실시간 연결 확인 중…';if(status==='SUBSCRIBED')load().catch(e=>say(e.message))})}
async function session(s){if(user?.id===s?.user?.id)return;clear();user=s?.user||null;$('auth').hidden=!!user;$('signed').hidden=!user;if(user)await setupFamily()}
$('authForm').onsubmit=e=>{e.preventDefault();act(async()=>{const data=result(await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}));$('password').value='';await session(data.session)})};
$('signup').onclick=()=>act(async()=>{if(!$('authForm').reportValidity())return;const n=$('displayName').value.trim();if(!n)throw Error('표시 이름을 입력하세요');const data=result(await db.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{display_name:n}}}));$('password').value='';if(data.session)await session(data.session);else say('가입 확인 이메일을 확인한 뒤 로그인하세요.')});
$('logout').onclick=()=>act(async()=>{result(await db.auth.signOut());await session(null)});
$('create').onclick=()=>act(async()=>{result(await db.rpc('ledger_manage',{action:'create'}));await setupFamily()});
$('join').onclick=()=>act(async()=>{result(await db.rpc('ledger_manage',{action:'join',invite_code:$('joinCode').value.trim()}));$('joinCode').value='';await setupFamily()});
$('renew').onclick=()=>act(async()=>{result(await db.rpc('ledger_manage',{action:'renew'}));await readInvite()});
$('copy').onclick=()=>act(async()=>{await navigator.clipboard.writeText(inviteCode);say('초대 코드를 복사했습니다.')});
$('entryForm').onsubmit=e=>{e.preventDefault();act(async()=>{const amount=Number($('amount').value);if(!Number.isSafeInteger(amount)||amount<1||amount>999999999999)throw Error('금액은 1~999,999,999,999원의 정수로 입력하세요');const row={transaction_date:$('date').value,type:$('type').value,amount,category:$('category').value,description:$('description').value.trim()};$('save').textContent='저장 중…';try{if(editing){const changed=result(await db.from('ledger_entries').update(row).eq('id',editing).select('id'));if(!changed.length)throw Error('내역이 없거나 수정 권한이 없습니다')}else result(await db.from('ledger_entries').insert({...row,id:crypto.randomUUID(),family_id:family,user_id:user.id}));reset();await load()}finally{$('save').textContent=editing?'수정 저장':'저장'}})};
$('type').onchange=options;$('cancel').onclick=reset;$('month').onchange=()=>load().catch(e=>say(e.message));window.addEventListener('online',()=>load().catch(e=>say(e.message)));document.addEventListener('visibilitychange',()=>{if(!document.hidden)load().catch(e=>say(e.message))});
$('month').value=today().slice(0,7);reset();db.auth.onAuthStateChange((event,s)=>{setTimeout(()=>session(s).catch(e=>say(e.message)),0)});db.auth.getSession().then(r=>session(result(r).session)).catch(e=>say(e.message));
</script></main></html>
